name: MediaStrike native preview

on:
  push:
    branches: [codex/mediastrike-rename, codex/mediastrike-queue-ui, codex/mediastrike-subtitles, codex/mediastrike-subtitles-verification, codex/mediastrike-focus-view, codex/mediastrike-mute-control, codex/mediastrike-speed-control, codex/mediastrike-ui-av-integration]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Rust
        shell: pwsh
        run: rustup default stable
      - name: Install GStreamer 1.26.11 from conda-forge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $conda = Join-Path $env:CONDA 'Scripts\conda.exe'
          $prefix = Join-Path $env:RUNNER_TEMP 'mediastrike-gstreamer'
          & $conda create --yes --prefix $prefix --override-channels --channel conda-forge --solver libmamba 'gstreamer=1.26.11' 'gst-plugins-base=1.26.11' 'gst-plugins-good=1.26.11' pkg-config
          if ($LASTEXITCODE -ne 0) { throw 'Conda-forge GStreamer installation failed' }
          $gst = Join-Path $prefix 'Library'
          if (-not (Test-Path (Join-Path $gst 'bin\pkg-config.exe'))) { throw 'Conda-forge pkg-config was not found' }
          if (-not (Test-Path (Join-Path $gst 'bin\gst-launch-1.0.exe'))) { throw 'Conda-forge GStreamer runtime was not found' }
          $env:PKG_CONFIG_PATH = "$gst\lib\pkgconfig;$gst\lib\gstreamer-1.0\pkgconfig"
          & "$gst\bin\pkg-config.exe" --modversion gstreamer-1.0 gstreamer-app-1.0 gstreamer-video-1.0
          if ($LASTEXITCODE -ne 0) { throw 'Conda-forge GStreamer development files are incomplete' }
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gst" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PKG_CONFIG=$gst\bin\pkg-config.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PKG_CONFIG_PATH=$gst\lib\pkgconfig;$gst\lib\gstreamer-1.0\pkgconfig" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "GST_PLUGIN_SYSTEM_PATH=$gst\lib\gstreamer-1.0" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "$gst\bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: Test source
        shell: pwsh
        run: cargo test --locked -j 2
      - name: Build native executable
        shell: pwsh
        run: cargo build --locked -j 2
      - name: Exercise decoded local playback
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sample = Join-Path $env:RUNNER_TEMP 'mediastrike-sample.avi'
          $sampleGst = $sample.Replace('\', '/')
          & gst-launch-1.0.exe -q avimux name=mux ! filesink "location=$sampleGst" `
            videotestsrc pattern=ball num-buffers=2 ! 'video/x-raw,format=BGR,width=320,height=180,framerate=1/1' ! queue ! mux.
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $sample)) { throw 'Synthetic AVI generation failed' }
          if ((Get-Item $sample).Length -gt 1MB) { throw 'Synthetic AVI exceeds 1 MiB cap' }
          $env:PLAYSTRIKE_SAMPLE = $sample
          $second = Join-Path $env:RUNNER_TEMP 'mediastrike-second-sample.avi'
          Copy-Item -LiteralPath $sample -Destination $second
          $env:PLAYSTRIKE_SAMPLE_SECOND = $second
          $env:GST_AUDIOSINK = 'fakesink'
          cargo test --locked -j 2 decodes_and_controls_local_audio_video -- --ignored
          if ($LASTEXITCODE -ne 0) { throw 'Headless playback test failed' }
          cargo test --locked -j 2 native_queue_controls_and_end_of_file_advance -- --ignored
          if ($LASTEXITCODE -ne 0) { throw 'Native queue and end-of-file test failed' }
          $subtitleVideo = Join-Path $env:RUNNER_TEMP 'mediastrike-subtitle-video.avi'
          $subtitleVideoGst = $subtitleVideo.Replace('\', '/')
          & gst-launch-1.0.exe -q avimux name=mux ! filesink "location=$subtitleVideoGst" `
            videotestsrc pattern=black num-buffers=6 ! 'video/x-raw,format=BGR,width=320,height=180,framerate=1/1' ! queue ! mux.
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $subtitleVideo)) { throw 'Subtitle test AVI generation failed' }
          if ((Get-Item $subtitleVideo).Length -gt 2MB) { throw 'Subtitle test AVI exceeds 2 MiB cap' }
          $subtitle = Join-Path $env:RUNNER_TEMP 'mediastrike-synthetic.srt'
          @('1', '00:00:00,000 --> 00:00:05,500', 'Synthetic subtitle test', '') | Set-Content -LiteralPath $subtitle -Encoding ascii
          $env:PLAYSTRIKE_SUBTITLE_VIDEO = $subtitleVideo
          $env:PLAYSTRIKE_SUBTITLE_SAMPLE = $subtitle
          cargo test --locked -j 2 focus_ -- --ignored
          if ($LASTEXITCODE -ne 0) { throw 'Focus transition drag test failed' }
          cargo test --locked -j 2 mute_survives_queue_and_subtitle_replacement -- --ignored
          if ($LASTEXITCODE -ne 0) { throw 'Mute continuity test failed' }
          cargo test --locked -j 2 playback_speed_survives_seek_queue_subtitle_and_focus -- --ignored
          if ($LASTEXITCODE -ne 0) { throw 'Playback speed continuity test failed' }
          cargo test --locked -j 2 discovers_and_switches_external_subtitle_track -- --ignored
          if ($LASTEXITCODE -ne 0) { throw 'External subtitle track test failed' }
          $vtt = Join-Path $env:RUNNER_TEMP 'mediastrike-synthetic.vtt'
          @('WEBVTT', '', '00:00:00.000 --> 00:00:05.500', 'Synthetic VTT caption', '') | Set-Content -LiteralPath $vtt -Encoding ascii
          $malformed = Join-Path $env:RUNNER_TEMP 'mediastrike-malformed.srt'
          'not a subtitle file' | Set-Content -LiteralPath $malformed -Encoding ascii
          $env:PLAYSTRIKE_SUBTITLE_VTT = $vtt
          $env:PLAYSTRIKE_SUBTITLE_MALFORMED = $malformed
          $audioVideo = Join-Path $env:RUNNER_TEMP 'mediastrike-mute-audio.mkv'
          $audioVideoGst = $audioVideo.Replace('\', '/')
          & gst-launch-1.0.exe -q -e matroskamux name=mux ! filesink "location=$audioVideoGst" `
            videotestsrc pattern=black num-buffers=8 ! 'video/x-raw,format=BGR,width=320,height=180,framerate=1/1' ! queue ! mux.video_0 `
            audiotestsrc wave=sine num-buffers=80 samplesperbuffer=1600 ! 'audio/x-raw,format=S16LE,channels=1,rate=16000' ! queue ! mux.audio_0
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $audioVideo)) { throw 'Mute PCM fixture generation failed' }
          if ((Get-Item $audioVideo).Length -gt 3MB) { throw 'Mute PCM fixture exceeds 3 MiB cap' }
          $env:PLAYSTRIKE_MUTE_AUDIO_VIDEO = $audioVideo
          cargo test --locked -j 2 muted_pcm_output_survives_start_pause_and_replay -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Mute startup, pause, and replay output-sample test failed' }
          cargo test --locked -j 2 muted_pcm_survives_app_subtitle_failure -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'App subtitle failure mute output-sample test failed' }
          cargo test --locked -j 2 rejected_initial_rate_falls_back_and_keeps_playback -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Rejected rate fallback test failed' }
          $audioOnly = Join-Path $env:RUNNER_TEMP 'mediastrike-audio-only.wav'
          $audioOnlyGst = $audioOnly.Replace('\', '/')
          & gst-launch-1.0.exe -q audiotestsrc wave=sine num-buffers=80 samplesperbuffer=1600 ! 'audio/x-raw,format=S16LE,channels=1,rate=16000' ! wavenc ! filesink "location=$audioOnlyGst"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $audioOnly)) { throw 'Audio-only fixture generation failed' }
          if ((Get-Item $audioOnly).Length -gt 1MB) { throw 'Audio-only fixture exceeds 1 MiB cap' }
          $env:PLAYSTRIKE_AUDIO_ONLY = $audioOnly
          cargo test --locked -j 2 audio_only_rate_uses_pipeline_fallback -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Audio-only rate fallback test failed' }
          $avTiming = Join-Path $env:RUNNER_TEMP 'mediastrike-av-timing.mkv'
          $avTimingGst = $avTiming.Replace('\', '/')
          & gst-launch-1.0.exe -q -e matroskamux name=mux ! filesink "location=$avTimingGst" `
            videotestsrc pattern=ball num-buffers=80 ! 'video/x-raw,format=BGR,width=64,height=64,framerate=10/1' ! queue ! mux.video_0 `
            audiotestsrc wave=sine num-buffers=80 samplesperbuffer=1600 ! 'audio/x-raw,format=S16LE,channels=1,rate=16000' ! queue ! mux.audio_0
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $avTiming)) { throw 'A/V timing fixture generation failed' }
          if ((Get-Item $avTiming).Length -gt 3MB) { throw 'A/V timing fixture exceeds 3 MiB cap' }
          $env:PLAYSTRIKE_AV_TIMING_VIDEO = $avTiming
          cargo test --locked -j 2 audio_video_timestamps_align_at_supported_rates -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'A/V timestamp alignment test failed' }
          cargo test --locked -j 2 rate_during_malformed_subtitle_recovery -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Rate change during malformed subtitle recovery test failed' }
          cargo test --locked -j 2 mute_and_speed_buttons_accept_egui_pointer_events -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Egui pointer control activation test failed' }
          # Best-effort native renderer probe. Hosted runners may not expose a desktop.
          New-Item -ItemType Directory -Force artifact | Out-Null
          "source=$env:GITHUB_SHA" | Set-Content artifact/capture-probe.txt -Encoding ascii
          foreach ($view in @('normal', 'focus')) {
            $capture = Join-Path $env:RUNNER_TEMP "mediastrike-$view-control-preview.png"
            $arguments = @($avTiming, '--capture', $capture)
            if ($view -eq 'focus') { $arguments = @($avTiming, '--focus-view', '--capture', $capture) }
            try {
              $app = Start-Process -FilePath 'target/debug/playstrike.exe' -ArgumentList $arguments -PassThru -WindowStyle Hidden
              if (-not $app.WaitForExit(20000)) {
                $app.Kill()
                $app.WaitForExit()
                "$view=timeout" | Add-Content artifact/capture-probe.txt -Encoding ascii
              } elseif ($app.ExitCode -eq 0 -and (Test-Path -LiteralPath $capture)) {
                if ((Get-Item -LiteralPath $capture).Length -gt 1MB) { throw 'Capture exceeds 1 MiB cap' }
                Copy-Item -LiteralPath $capture -Destination "artifact/control-$view.png"
                "$view=captured sha256=$((Get-FileHash -LiteralPath $capture -Algorithm SHA256).Hash)" | Add-Content artifact/capture-probe.txt -Encoding ascii
              } else {
                "$view=unavailable exit=$($app.ExitCode)" | Add-Content artifact/capture-probe.txt -Encoding ascii
              }
            } catch {
              "$view=unavailable error=$($_.Exception.GetType().Name)" | Add-Content artifact/capture-probe.txt -Encoding ascii
            }
          }
          Get-Content artifact/capture-probe.txt
          cargo test --locked -j 2 subtitle_file_choice_keeps_playback_on_cancel_and_async_failure -- --ignored
          if ($LASTEXITCODE -ne 0) { throw 'Subtitle file state and async failure test failed' }
          $embeddedA = Join-Path $env:RUNNER_TEMP 'mediastrike-embedded-a.srt'
          $embeddedB = Join-Path $env:RUNNER_TEMP 'mediastrike-embedded-b.srt'
          @('1', '00:00:00,000 --> 00:00:07,500', 'Embedded track A', '') | Set-Content -LiteralPath $embeddedA -Encoding ascii
          @('1', '00:00:00,000 --> 00:00:07,500', 'Embedded track B', '') | Set-Content -LiteralPath $embeddedB -Encoding ascii
          $embedded = Join-Path $env:RUNNER_TEMP 'mediastrike-two-subtitles.mkv'
          $embeddedGst = $embedded.Replace('\', '/')
          $embeddedAGst = $embeddedA.Replace('\', '/')
          $embeddedBGst = $embeddedB.Replace('\', '/')
          & gst-launch-1.0.exe -q -e matroskamux name=mux ! filesink "location=$embeddedGst" `
            videotestsrc pattern=black num-buffers=8 ! 'video/x-raw,format=BGR,width=320,height=180,framerate=1/1' ! queue ! mux.video_0 `
            filesrc "location=$embeddedAGst" ! subparse ! queue ! mux.subtitle_0 `
            filesrc "location=$embeddedBGst" ! subparse ! queue ! mux.subtitle_1
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $embedded)) { throw 'Embedded subtitle Matroska generation failed' }
          if ((Get-Item $embedded).Length -gt 3MB) { throw 'Embedded subtitle fixture exceeds 3 MiB cap' }
          $env:PLAYSTRIKE_EMBEDDED_SUBTITLE_VIDEO = $embedded
          cargo test --locked -j 2 discovers_switches_and_disables_two_embedded_tracks -- --ignored
          if ($LASTEXITCODE -ne 0) { throw 'Embedded subtitle selection test failed' }
          cargo test --locked -j 2 pending_subtitle_choice_ -- --ignored
          if ($LASTEXITCODE -ne 0) { throw 'Pending subtitle choice test failed' }
          cargo test --locked -j 2 repeat_one_keeps_external_and_embedded_subtitle_choices -- --ignored
          if ($LASTEXITCODE -ne 0) { throw 'Repeat-one subtitle continuity test failed' }
      - name: Bound and hash executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-Item target/debug/playstrike.exe
          if ($exe.Length -gt 120MB) { throw "Executable exceeds 120 MiB cap: $($exe.Length)" }
          New-Item -ItemType Directory -Force artifact | Out-Null
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          "$sha  playstrike.exe" | Set-Content artifact/SHA256.txt -Encoding ascii
          "commit=$env:GITHUB_SHA" | Set-Content artifact/SOURCE.txt -Encoding ascii
          "cargo_lock_sha256=$((Get-FileHash Cargo.lock -Algorithm SHA256).Hash)" | Add-Content artifact/SOURCE.txt -Encoding ascii
          Write-Output "Executable bytes: $($exe.Length); SHA-256: $sha; source: $env:GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: mediastrike-native-preview
          path: |
            target/debug/playstrike.exe
            artifact/SHA256.txt
            artifact/SOURCE.txt
            artifact/capture-probe.txt
            artifact/control-*.png
          if-no-files-found: error
          retention-days: 1
